[package]
name = "notli-music-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Platform-independent Rust music playback and download domain for Notli"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
