buildscript {
    ext {
        agp_version = '9.3.2'
        kotlin_version = '2.4.10'
        kotlin_coroutines_version = '1.11.0'
        navigation_version = "2.10.2"
        hilt_version = '2.60.1'
        room_version = '2.8.5'
        core_version = '1.19.1'
        desugaring_version = '2.1.3'

        min_sdk = 24
        target_sdk = 37
        ndk_version = "28.2.13676358"

    }

    dependencies {
        // Hilt isn't compatible with the new plugin syntax yet.
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:2.3.0"
    }
}

plugins {
    // Android studio doesn't understand this syntax
    //noinspection GradlePluginVersion
    id "com.android.application" version "$agp_version" apply false
    id "androidx.navigation.safeargs.kotlin" version "$navigation_version" apply false
    //noinspection GradlePluginVersion
    id 'com.android.library' version "$agp_version" apply false
    id "org.jetbrains.kotlin.plugin.parcelize" version "$kotlin_version" apply false
    id "com.google.devtools.ksp" version '2.3.6' apply false
    // We use spotless in the root build.gradle to apply to all modules.
    id "com.diffplug.spotless" version "8.11.0" apply true
    id "org.jetbrains.kotlin.plugin.compose" version "$kotlin_version" apply false
}

spotless {
    kotlin {
        target "*/src/**/*.kt"
        ktfmt().kotlinlangStyle()
        licenseHeaderFile("NOTICE")
    }

    cpp {
        target("*/src/**/cpp/*.cpp", "*/src/**/cpp/*.h", "*/src/**/cpp/*.hpp")
        eclipseCdt().configFile("eclipse-cdt.xml")
        licenseHeaderFile("NOTICE")
    }
}

// The pinned Media3 submodule currently contains a stale experimental HAGC argument in
// ProgressiveMediaSource.Factory.createSourceDescriptor(): the flag is not declared by the
// factory and the ProgressiveMediaSource constructor does not accept it. Apply this narrow,
// deterministic compatibility patch before compiling the vendored Media3 module.
tasks.register("patchMedia3ProgressiveMediaSource") {
    group = "build"
    description = "Apply the compatibility fix required by the pinned Media3 submodule."

    doLast {
        def sourceFile = file("media/libraries/exoplayer/src/main/java/androidx/media3/exoplayer/source/ProgressiveMediaSource.java")
        if (!sourceFile.isFile()) {
            throw new GradleException("Media3 ProgressiveMediaSource source was not found: ${sourceFile}")
        }

        def source = sourceFile.getText("UTF-8")
        def staleDeclaration = "      boolean enableHagcPlayback = experimentalEnableHagcPlayback;\n"
        def staleArgument = "                  enableHagcPlayback,\n"

        if (source.contains(staleDeclaration) && source.contains(staleArgument)) {
            source = source.replace(staleDeclaration, "").replace(staleArgument, "")
            sourceFile.write(source, "UTF-8")
            logger.lifecycle("Applied Media3 ProgressiveMediaSource compatibility fix.")
        } else if (source.contains("experimentalEnableHagcPlayback") || source.contains("enableHagcPlayback")) {
            throw new GradleException("Media3 ProgressiveMediaSource changed; review the compatibility patch before building.")
        } else {
            logger.lifecycle("Media3 ProgressiveMediaSource is already compatible; no patch needed.")
        }
    }
}

// The Media3 Android plugin registers javac tasks lazily. Hook the actual compile task
// before it runs instead of relying on projectsEvaluated task lookup, which can miss
// lazily-created variant tasks on newer Android Gradle Plugin versions.
gradle.beforeProject { candidate ->
    if (candidate.path == ":media:lib-exoplayer") {
        candidate.tasks.configureEach { compileTask ->
            if (compileTask.name.endsWith("JavaWithJavac")) {
                compileTask.doFirst {
                    rootProject.tasks.named("patchMedia3ProgressiveMediaSource").get().actions.each { action ->
                        action.execute(compileTask)
                    }
                }
            }
        }
    }
}
