name: Notli Rust Android Core

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [Noti-rust-core, noti-core-hardening]
    paths:
      - 'native-core/**'
      - 'app/src/main/java/org/oxycblt/auxio/playback/nativecore/**'
      - 'app/build.gradle'
      - '.github/workflows/notli-rust-android.yml'
  pull_request:
    branches: [Noti]
    paths:
      - 'native-core/**'
      - 'app/src/main/java/org/oxycblt/auxio/playback/nativecore/**'
      - 'app/build.gradle'
      - '.github/workflows/notli-rust-android.yml'

permissions:
  contents: read

jobs:
  rust-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust unit tests
        run: cargo test --manifest-path native-core/Cargo.toml

      - name: Build Android APK (includes Rust .so for all configured ABIs)
        run: ./gradlew patchMedia3ProgressiveSource app:packageDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Notli-Rust-Core-debug
          path: app/build/outputs/apk/debug/app-debug.apk
