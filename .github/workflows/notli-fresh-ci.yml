name: Notli Fresh CI

run-name: Notli Fresh CI · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - noti-core-hardening
  pull_request:
    branches:
      - Noti
    paths:
      - 'app/**'
      - 'musikr/**'
      - 'native-core/**'
      - 'media/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/notli-fresh-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notli-fresh-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Rust and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "ndk;28.2.13676358"; then
              exit 0
            fi
            echo "NDK installation attempt ${attempt}/3 failed; retrying."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_HOME/.temp"
            sleep 10
          done
          echo "Could not install Android NDK."
          exit 1

      - name: Set up stable Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run native Rust tests
        run: cargo test --manifest-path native-core/Cargo.toml

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Run Android unit tests
        run: ./gradlew --no-daemon musikr:testDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon patchMedia3ProgressiveMediaSource app:packageDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Notli-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
