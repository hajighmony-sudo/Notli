name: Notli CI

run-name: Notli CI · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [noti-core-hardening]
  pull_request:
    branches: [Noti]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notli-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests
        run: cargo test --manifest-path native-core/Cargo.toml

  android-checks:
    name: Android lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "ndk;28.2.13676358"; then
              exit 0
            fi
            echo "NDK download/install failed (attempt $attempt/3); clearing partial package and retrying."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_HOME/.temp"
            sleep 10
          done
          echo "Unable to install Android NDK after 3 attempts."
          exit 1
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Apply Kotlin formatting
        run: ./gradlew spotlessApply
      - name: Commit Kotlin formatting
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          if ! git diff --cached --quiet; then
            git commit -m "Apply Kotlin formatting"
            git push
          fi
      - name: Verify Kotlin formatting
        run: ./gradlew spotlessCheck
      - name: Run musikr unit tests
        run: ./gradlew musikr:testDebug

  android-build:
    name: Build Notli Android APK
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "ndk;28.2.13676358"; then
              exit 0
            fi
            echo "NDK download/install failed (attempt $attempt/3); clearing partial package and retrying."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_HOME/.temp"
            sleep 10
          done
          echo "Unable to install Android NDK after 3 attempts."
          exit 1
      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK with native Rust core
        run: ./gradlew patchMedia3ProgressiveMediaSource app:packageDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Notli-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ci-status:
    name: All checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - rust-core
      - android-checks
      - android-build
    steps:
      - name: Verify all CI jobs passed
        env:
          RUST_RESULT: ${{ needs.rust-core.result }}
          ANDROID_CHECKS_RESULT: ${{ needs.android-checks.result }}
          ANDROID_BUILD_RESULT: ${{ needs.android-build.result }}
        run: |
          echo "Rust core: ${RUST_RESULT}"
          echo "Android checks: ${ANDROID_CHECKS_RESULT}"
          echo "Android build: ${ANDROID_BUILD_RESULT}"
          test "${RUST_RESULT}" = "success"
          test "${ANDROID_CHECKS_RESULT}" = "success"
          test "${ANDROID_BUILD_RESULT}" = "success"
